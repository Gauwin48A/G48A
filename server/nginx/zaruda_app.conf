# Nginx Reverse Proxy Configuration for Zaruda Production Backend
# Place in /etc/nginx/sites-available/zaruda.conf and symlink to sites-enabled

upstream zaruda_backend {
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Limit request rate per IP (WAF level)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name api.zaruda.app; # Replace with your domain

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.zaruda.app; # Replace with your domain

    # SSL Certificate Configuration (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/api.zaruda.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zaruda.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum payload size for media uploads (images/documents)
    client_max_body_size 25M;

    # Static File Upload Storage
    location /public_uploads/ {
        alias /var/www/zaruda/server/public_uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy Routing
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://zaruda_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
