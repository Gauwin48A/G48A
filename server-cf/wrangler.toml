name = "mhub-api"
main = "src/index.ts"
compatibility_date = "2024-12-20"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------
# Bindings
# ------------------------------------------------------------------
# D1 (SQLite) — free tier: 5 GB
[[d1_databases]]
binding = "DB"
database_name = "mhub_db"
database_id = "REPLACE_WITH_D1_ID_AFTER_CREATE"
migrations_dir = "migrations"

# KV for rate limiting + session cache (free: 100k reads/day)
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID_AFTER_CREATE"

# R2 for public post images + private KYC docs (free: 10 GB + free egress)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mhub-media"

[[r2_buckets]]
binding = "KYC_DOCS"
bucket_name = "mhub-kyc-docs"

# ------------------------------------------------------------------
# Vars (non-secret; overrideable per env). Secrets via `wrangler secret put`.
# ------------------------------------------------------------------
[vars]
ENV = "production"
GOOGLE_OAUTH_AUDIENCE = "REPLACE_WITH_YOUR_ANDROID_OR_WEB_CLIENT_ID.apps.googleusercontent.com"
CORS_ALLOWED_ORIGINS = "*"
PUBLIC_MEDIA_HOST = "https://mhub-media.<your-account>.r2.dev"
ACCESS_TOKEN_TTL_SECONDS = "2592000"

# Set as secrets:
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_API_KEY
#   wrangler secret put KYC_PROVIDER_KEY   (optional)

# ------------------------------------------------------------------
# Observability
# ------------------------------------------------------------------
[observability]
enabled = true

[observability.logs]
enabled = true
