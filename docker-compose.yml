version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaruda}
      POSTGRES_USER: ${POSTGRES_USER:-zaruda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaruda} -d ${POSTGRES_DB:-zaruda}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zaruda-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zaruda-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zaruda}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-zaruda}
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      CORS_ORIGINS: "https://ideal-xylophone-77v6x7w9g6whpr6v-5001.app.github.dev,https://ideal-xylophone-77v6x7w9g6whpr6v-4173.app.github.dev,https://ideal-xylophone-77v6x7w9g6whpr6v-8081.app.github.dev"
    ports:
      - "${SERVER_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - uploads:/app/uploads
      - server-logs:/app/logs
    networks:
      - zaruda-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-4173}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - zaruda-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local
  server-logs:
    driver: local

networks:
  zaruda-net:
    driver: bridge
