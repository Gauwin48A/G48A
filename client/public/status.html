<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <title>MHub Status</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f9ff;
        --panel: #ffffff;
        --text: #0b1f3f;
        --muted: #445b84;
        --accent: #2d6bf3;
        --ok: #0a9e4f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top left, #dbe7ff, var(--bg) 45%);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        width: min(680px, 100%);
        background: var(--panel);
        border: 1px solid #d6e2ff;
        border-radius: 18px;
        box-shadow: 0 18px 42px rgba(30, 72, 165, 0.13);
        padding: 28px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.35rem, 1.2rem + 1vw, 2rem);
      }
      p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.5;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }
      .pill {
        border: 1px solid #cfe0ff;
        background: #edf3ff;
        color: #20417c;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.92rem;
      }
      .pill.ok {
        background: #e8fff2;
        border-color: #b8f0d0;
        color: #056c35;
      }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        filter: brightness(0.94);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>MHub Platform Status</h1>
      <p>This page is a static fallback status endpoint for high-availability communication.</p>
      <p>If the app is temporarily degraded, core recovery and verification runbooks are already in place.</p>
      <div class="row">
        <span class="pill ok">Current Status: Operational</span>
        <span class="pill">Last Updated: Manual static fallback</span>
      </div>
      <a href="/support">Contact Support</a>
    </main>
  </body>
</html>
