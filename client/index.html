
<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHub - Verified Marketplace</title>
    <meta
      name="description"
      content="MHub is a secure marketplace for buying and selling verified products with trust-first listings and local discovery."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#2563eb" />
    <!-- M17 Fix: Removed hardcoded https://example.com canonical URL -->

    <!-- Resource hints — zero-cost 100-300ms savings on first API/image load -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MHub" />
    <meta property="og:title" content="MHub - Verified Marketplace" />
    <meta
      property="og:description"
      content="Explore trusted listings, discover nearby deals, and buy or sell confidently on MHub."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MHub - Verified Marketplace" />
    <meta
      name="twitter:description"
      content="Explore trusted listings, discover nearby deals, and buy or sell confidently on MHub."
    />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- Security headers via meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Structured data: Organization + WebSite search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "MHub",
          "url": "https://example.com",
          "logo": "https://example.com/pwa-512x512.png",
          "description": "Premium verified marketplace for buying and selling products",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "MHub",
          "url": "https://example.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://example.com/all-posts?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <script>
      // Prevent dark-mode FOUC: apply theme class before first paint
      (function(){
        try {
          var t = localStorage.getItem('mhub-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content','#0f172a');
          }
        } catch(e){}
      })();
    </script>
    <script>
      // Block React DevTools, Redux DevTools, and other inspection tools before React loads
      (function(){
        try {
          var n=function(){},h=window.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          if(h&&typeof h==='object'){for(var k in h){if(typeof h[k]==='function')h[k]=n}h.inject=n;h.renderers=new Map();try{Object.freeze(h)}catch(e){}}
          if(!window.__REACT_DEVTOOLS_GLOBAL_HOOK__){Object.defineProperty(window,'__REACT_DEVTOOLS_GLOBAL_HOOK__',{value:Object.freeze({inject:n,onCommitFiberRoot:n,onCommitFiberUnmount:n,supportsFiber:false,renderers:new Map(),isDisabled:true}),writable:false,configurable:false})}
          // Block Redux DevTools
          if(!window.__REDUX_DEVTOOLS_EXTENSION__){Object.defineProperty(window,'__REDUX_DEVTOOLS_EXTENSION__',{value:undefined,writable:false,configurable:false})}
          if(!window.__REDUX_DEVTOOLS_EXTENSION_COMPOSE__){Object.defineProperty(window,'__REDUX_DEVTOOLS_EXTENSION_COMPOSE__',{value:undefined,writable:false,configurable:false})}
        }catch(e){}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
